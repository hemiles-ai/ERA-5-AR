<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERA5 Climate AR Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 2000;
        }
        
        #loading.hidden {
            display: none;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            backdrop-filter: blur(10px);
        }
        
        #controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        button:hover, button.active {
            background: rgba(59, 130, 246, 0.6);
            border-color: rgba(59, 130, 246, 0.8);
        }
        
        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        
        .marker-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 5px;
            transition: background 0.3s;
        }
        
        .marker-status.found {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>🌡️ Loading ERA5 Climate AR</h2>
        <p>Initializing camera and AR system...</p>
        <p style="font-size: 12px; opacity: 0.7;">Point your camera at the monitor display</p>
    </div>

    <div id="ui-overlay">
        <div style="font-size: 18px; font-weight: 600;">🌡️ ERA5 Climate Data - NE United States</div>
        <div style="margin-top: 8px; font-size: 12px; opacity: 0.8;">
            Markers: 
            <span class="marker-status" id="status-hiro"></span>TL
            <span class="marker-status" id="status-kanji" style="margin-left: 10px;"></span>TR
            <span class="marker-status" id="status-a" style="margin-left: 10px;"></span>BL
            <span class="marker-status" id="status-b" style="margin-left: 10px;"></span>BR
        </div>
        <div id="controls">
            <button class="active" onclick="setDataLayer('temperature')">Temperature</button>
            <button onclick="setDataLayer('precipitation')">Precipitation</button>
            <button onclick="setDataLayer('wind')">Wind Speed</button>
            <button onclick="setDataLayer('pressure')">Pressure</button>
        </div>
    </div>
    
    <div id="info">
        <div id="status">📷 Point camera at the monitor display...</div>
        <div id="data-info" style="margin-top: 8px; font-size: 12px; opacity: 0.8;"></div>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        loading-screen="enabled: false">

        <!-- Reference Marker (Hiro - Top Left) -->
        <!-- All climate data will be anchored relative to this marker -->
        <a-marker preset="hiro" id="marker-hiro">
            <!-- Climate data visualization anchored here -->
            <!-- Positioned to appear in CENTER of the four markers -->
            <a-entity id="climate-data-root" position="0.75 0.2 -0.75">
                
                <!-- NE United States terrain reference box -->
                <a-box 
                    position="0 0 0" 
                    width="1.5" 
                    depth="1.5" 
                    height="0.05"
                    color="#2d3748"
                    opacity="0.2"
                    wireframe="true">
                </a-box>
                
                <!-- Temperature Layer (Default) -->
                <a-entity id="temp-layer" visible="true">
                    <!-- Grid of temperature data points across NE US -->
                    <!-- North (Maine area) - cooler -->
                    <a-cylinder position="-0.5 0 -0.5" radius="0.08" height="0.20" color="#3b82f6" opacity="0.7"></a-cylinder>
                    <a-cylinder position="-0.25 0 -0.5" radius="0.08" height="0.25" color="#22c55e" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0 0 -0.5" radius="0.08" height="0.22" color="#22c55e" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.25 0 -0.5" radius="0.08" height="0.26" color="#22c55e" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.5 0 -0.5" radius="0.08" height="0.24" color="#3b82f6" opacity="0.7"></a-cylinder>
                    
                    <!-- Mid-North (NY, MA area) -->
                    <a-cylinder position="-0.5 0 -0.25" radius="0.08" height="0.30" color="#22c55e" opacity="0.7"></a-cylinder>
                    <a-cylinder position="-0.25 0 -0.25" radius="0.08" height="0.35" color="#facc15" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0 0 -0.25" radius="0.08" height="0.38" color="#facc15" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.25 0 -0.25" radius="0.08" height="0.33" color="#22c55e" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.5 0 -0.25" radius="0.08" height="0.28" color="#22c55e" opacity="0.7"></a-cylinder>
                    
                    <!-- Mid (PA, NJ area) -->
                    <a-cylinder position="-0.5 0 0" radius="0.08" height="0.40" color="#facc15" opacity="0.7"></a-cylinder>
                    <a-cylinder position="-0.25 0 0" radius="0.08" height="0.48" color="#f97316" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0 0 0" radius="0.08" height="0.45" color="#f97316" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.25 0 0" radius="0.08" height="0.42" color="#facc15" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.5 0 0" radius="0.08" height="0.36" color="#facc15" opacity="0.7"></a-cylinder>
                    
                    <!-- South (DC, MD area) - warmer -->
                    <a-cylinder position="-0.5 0 0.25" radius="0.08" height="0.50" color="#f97316" opacity="0.7"></a-cylinder>
                    <a-cylinder position="-0.25 0 0.25" radius="0.08" height="0.55" color="#ef4444" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0 0 0.25" radius="0.08" height="0.52" color="#ef4444" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.25 0 0.25" radius="0.08" height="0.48" color="#f97316" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.5 0 0.25" radius="0.08" height="0.44" color="#f97316" opacity="0.7"></a-cylinder>
                    
                    <a-cylinder position="-0.5 0 0.5" radius="0.08" height="0.58" color="#ef4444" opacity="0.7"></a-cylinder>
                    <a-cylinder position="-0.25 0 0.5" radius="0.08" height="0.60" color="#dc2626" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0 0 0.5" radius="0.08" height="0.58" color="#ef4444" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.25 0 0.5" radius="0.08" height="0.54" color="#ef4444" opacity="0.7"></a-cylinder>
                    <a-cylinder position="0.5 0 0.5" radius="0.08" height="0.50" color="#f97316" opacity="0.7"></a-cylinder>
                </a-entity>
                
                <!-- Precipitation Layer -->
                <a-entity id="precip-layer" visible="false">
                    <a-sphere position="-0.5 0.25 -0.5" radius="0.06" color="#3b82f6" opacity="0.6"></a-sphere>
                    <a-sphere position="-0.25 0.30 -0.5" radius="0.08" color="#2563eb" opacity="0.6"></a-sphere>
                    <a-sphere position="0 0.27 -0.5" radius="0.07" color="#3b82f6" opacity="0.6"></a-sphere>
                    <a-sphere position="0.25 0.28 -0.5" radius="0.07" color="#3b82f6" opacity="0.6"></a-sphere>
                    <a-sphere position="0.5 0.24 -0.5" radius="0.06" color="#60a5fa" opacity="0.6"></a-sphere>
                    
                    <a-sphere position="-0.5 0.35 -0.25" radius="0.09" color="#2563eb" opacity="0.6"></a-sphere>
                    <a-sphere position="-0.25 0.40 -0.25" radius="0.11" color="#1e40af" opacity="0.6"></a-sphere>
                    <a-sphere position="0 0.38 -0.25" radius="0.10" color="#2563eb" opacity="0.6"></a-sphere>
                    <a-sphere position="0.25 0.36 -0.25" radius="0.09" color="#2563eb" opacity="0.6"></a-sphere>
                    <a-sphere position="0.5 0.32 -0.25" radius="0.08" color="#3b82f6" opacity="0.6"></a-sphere>
                    
                    <a-sphere position="-0.5 0.42 0" radius="0.12" color="#1e40af" opacity="0.6"></a-sphere>
                    <a-sphere position="-0.25 0.48 0" radius="0.13" color="#1e3a8a" opacity="0.6"></a-sphere>
                    <a-sphere position="0 0.45 0" radius="0.12" color="#1e40af" opacity="0.6"></a-sphere>
                    <a-sphere position="0.25 0.44 0" radius="0.11" color="#1e40af" opacity="0.6"></a-sphere>
                    <a-sphere position="0.5 0.40 0" radius="0.10" color="#2563eb" opacity="0.6"></a-sphere>
                    
                    <a-sphere position="-0.5 0.50 0.25" radius="0.14" color="#1e3a8a" opacity="0.6"></a-sphere>
                    <a-sphere position="-0.25 0.54 0.25" radius="0.15" color="#1e3a8a" opacity="0.6"></a-sphere>
                    <a-sphere position="0 0.52 0.25" radius="0.14" color="#1e3a8a" opacity="0.6"></a-sphere>
                    <a-sphere position="0.25 0.50 0.25" radius="0.13" color="#1e40af" opacity="0.6"></a-sphere>
                    <a-sphere position="0.5 0.46 0.25" radius="0.12" color="#1e40af" opacity="0.6"></a-sphere>
                </a-entity>
                
                <!-- Wind Layer -->
                <a-entity id="wind-layer" visible="false">
                    <a-cone position="-0.5 0.20 -0.5" radius-bottom="0.06" radius-top="0.01" height="0.28" color="#10b981" rotation="0 50 0" opacity="0.7"></a-cone>
                    <a-cone position="-0.25 0.25 -0.5" radius-bottom="0.07" radius-top="0.01" height="0.32" color="#059669" rotation="0 55 0" opacity="0.7"></a-cone>
                    <a-cone position="0 0.22 -0.5" radius-bottom="0.06" radius-top="0.01" height="0.30" color="#10b981" rotation="0 52 0" opacity="0.7"></a-cone>
                    <a-cone position="0.25 0.26 -0.5" radius-bottom="0.07" radius-top="0.01" height="0.33" color="#059669" rotation="0 58 0" opacity="0.7"></a-cone>
                    
                    <a-cone position="-0.5 0.30 -0.25" radius-bottom="0.08" radius-top="0.01" height="0.38" color="#059669" rotation="0 65 0" opacity="0.7"></a-cone>
                    <a-cone position="-0.25 0.35 -0.25" radius-bottom="0.09" radius-top="0.01" height="0.42" color="#047857" rotation="0 70 0" opacity="0.7"></a-cone>
                    <a-cone position="0 0.32 -0.25" radius-bottom="0.08" radius-top="0.01" height="0.40" color="#059669" rotation="0 68 0" opacity="0.7"></a-cone>
                    <a-cone position="0.25 0.30 -0.25" radius-bottom="0.08" radius-top="0.01" height="0.38" color="#10b981" rotation="0 62 0" opacity="0.7"></a-cone>
                    
                    <a-cone position="-0.5 0.40 0" radius-bottom="0.10" radius-top="0.01" height="0.46" color="#047857" rotation="0 75 0" opacity="0.7"></a-cone>
                    <a-cone position="-0.25 0.45 0" radius-bottom="0.11" radius-top="0.01" height="0.50" color="#047857" rotation="0 78 0" opacity="0.7"></a-cone>
                    <a-cone position="0 0.42 0" radius-bottom="0.10" radius-top="0.01" height="0.48" color="#047857" rotation="0 76 0" opacity="0.7"></a-cone>
                    <a-cone position="0.25 0.38 0" radius-bottom="0.09" radius-top="0.01" height="0.44" color="#059669" rotation="0 72 0" opacity="0.7"></a-cone>
                    
                    <a-cone position="-0.25 0.50 0.25" radius-bottom="0.11" radius-top="0.01" height="0.52" color="#047857" rotation="0 80 0" opacity="0.7"></a-cone>
                    <a-cone position="0 0.48 0.25" radius-bottom="0.10" radius-top="0.01" height="0.50" color="#047857" rotation="0 78 0" opacity="0.7"></a-cone>
                </a-entity>
                
                <!-- Pressure Layer -->
                <a-entity id="pressure-layer" visible="false">
                    <a-torus position="-0.25 0.30 -0.5" radius="0.15" radius-tubular="0.015" color="#8b5cf6" opacity="0.7"></a-torus>
                    <a-torus position="0.25 0.28 -0.5" radius="0.14" radius-tubular="0.015" color="#a78bfa" opacity="0.7"></a-torus>
                    
                    <a-torus position="-0.4 0.38 -0.25" radius="0.18" radius-tubular="0.02" color="#7c3aed" opacity="0.7"></a-torus>
                    <a-torus position="0.2 0.36 -0.25" radius="0.16" radius-tubular="0.018" color="#8b5cf6" opacity="0.7"></a-torus>
                    
                    <a-torus position="-0.3 0.45 0" radius="0.20" radius-tubular="0.02" color="#6d28d9" opacity="0.7"></a-torus>
                    <a-torus position="0.2 0.42 0" radius="0.18" radius-tubular="0.018" color="#7c3aed" opacity="0.7"></a-torus>
                    
                    <a-torus position="-0.2 0.52 0.25" radius="0.22" radius-tubular="0.022" color="#6d28d9" opacity="0.7"></a-torus>
                    <a-torus position="0.2 0.48 0.25" radius="0.20" radius-tubular="0.02" color="#7c3aed" opacity="0.7"></a-torus>
                </a-entity>
                
                <!-- Title -->
                <a-text 
                    id="data-label"
                    value="Temperature - NE USA"
                    position="0 1.0 0"
                    align="center"
                    color="#ffffff"
                    width="2.5"
                    opacity="0.9">
                </a-text>
                
                <!-- Legend -->
                <a-entity position="1.0 0.5 0" rotation="0 -30 0">
                    <a-plane width="0.4" height="0.8" color="#000000" opacity="0.7"></a-plane>
                    <a-text value="Legend" position="0 0.35 0.01" align="center" color="#ffffff" width="0.8"></a-text>
                    <a-text id="legend-text" value="High\n\n\n\nLow" position="0 0.05 0.01" align="center" color="#ffffff" width="0.7"></a-text>
                </a-entity>
                
                <!-- Geographic labels -->
                <a-text value="ME" position="0 0.15 -0.6" align="center" color="#cbd5e0" width="0.6" opacity="0.6"></a-text>
                <a-text value="NYC" position="0.3 0.15 -0.1" align="center" color="#cbd5e0" width="0.6" opacity="0.6"></a-text>
                <a-text value="DC" position="-0.1 0.15 0.4" align="center" color="#cbd5e0" width="0.6" opacity="0.6"></a-text>
            </a-entity>
        </a-marker>
        
        <!-- Additional markers for reference (help with tracking stability) -->
        <a-marker preset="kanji" id="marker-kanji"></a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let currentLayer = 'temperature';
        let markersFound = {
            hiro: false,
            kanji: false
        };
        
        // Layer configurations
        const layerConfig = {
            temperature: {
                label: 'Temperature - NE USA',
                info: 'Heat map showing temperature variations. Red = warmer (DC), Blue = cooler (Maine).',
                legend: 'High\n\n\n\nLow'
            },
            precipitation: {
                label: 'Precipitation - NE USA',
                info: 'Sphere size indicates rainfall levels. Coastal areas show higher precipitation.',
                legend: 'High\n\n\n\nLow'
            },
            wind: {
                label: 'Wind Speed - NE USA',
                info: 'Arrow height shows wind speed. Prevailing winds flow west to east.',
                legend: 'Fast\n\n\n\nSlow'
            },
            pressure: {
                label: 'Pressure - NE USA',
                info: 'Ring size represents atmospheric pressure systems.',
                legend: 'High\n\n\n\nLow'
            }
        };
        
        // Set up marker detection
        const markerHiro = document.querySelector('#marker-hiro');
        const markerKanji = document.querySelector('#marker-kanji');
        
        if (markerHiro) {
            markerHiro.addEventListener('markerFound', function() {
                markersFound.hiro = true;
                updateMarkerStatus();
            });
            
            markerHiro.addEventListener('markerLost', function() {
                markersFound.hiro = false;
                updateMarkerStatus();
            });
        }
        
        if (markerKanji) {
            markerKanji.addEventListener('markerFound', function() {
                markersFound.kanji = true;
                updateMarkerStatus();
            });
            
            markerKanji.addEventListener('markerLost', function() {
                markersFound.kanji = false;
                updateMarkerStatus();
            });
        }
        
        function updateMarkerStatus() {
            // Update status indicators
            document.getElementById('status-hiro').classList.toggle('found', markersFound.hiro);
            
            // Update main status message
            if (markersFound.hiro) {
                document.getElementById('status').innerHTML = '✅ Tracking active! Climate data visible.';
            } else {
                document.getElementById('status').innerHTML = '📷 Point camera at the monitor display...';
            }
        }
        
        // Function to switch data layers
        window.setDataLayer = function(layer) {
            currentLayer = layer;
            
            // Update active button
            document.querySelectorAll('#controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Hide all layers
            document.getElementById('temp-layer').setAttribute('visible', false);
            document.getElementById('precip-layer').setAttribute('visible', false);
            document.getElementById('wind-layer').setAttribute('visible', false);
            document.getElementById('pressure-layer').setAttribute('visible', false);
            
            // Show selected layer
            const layerMap = {
                'temperature': 'temp-layer',
                'precipitation': 'precip-layer',
                'wind': 'wind-layer',
                'pressure': 'pressure-layer'
            };
            
            document.getElementById(layerMap[layer]).setAttribute('visible', true);
            
            // Update label and info
            const config = layerConfig[layer];
            document.getElementById('data-label').setAttribute('value', config.label);
            document.getElementById('data-info').innerHTML = config.info;
            document.getElementById('legend-text').setAttribute('value', config.legend);
        };
        
        // Initialize with temperature data info
        document.getElementById('data-info').innerHTML = layerConfig.temperature.info;
        
        // Check if libraries loaded
        let checkCount = 0;
        const checkLibraries = setInterval(() => {
            checkCount++;
            if (typeof AFRAME !== 'undefined') {
                clearInterval(checkLibraries);
                initializeAR();
            } else if (checkCount > 50) { // 5 seconds
                clearInterval(checkLibraries);
                document.getElementById('loading').innerHTML = `
                    <h2>⚠️ Network Error</h2>
                    <p>Unable to load AR libraries from CDN.</p>
                    <p style="font-size: 14px;">This app requires internet access to load A-Frame and AR.js libraries.</p>
                    <p style="font-size: 12px; opacity: 0.7;">Please check your network settings or enable internet access.</p>
                `;
            }
        }, 100);
        
        function initializeAR() {
            // Hide loading screen after a delay
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 2000);
            
            // Add subtle animation to data points
            if (typeof AFRAME !== 'undefined') {
                AFRAME.registerComponent('gentle-pulse', {
                    tick: function(time) {
                        const scale = 1 + Math.sin(time / 800) * 0.06;
                        this.el.object3D.scale.set(scale, scale, scale);
                    }
                });
                
                // Apply animation to some elements
                setTimeout(() => {
                    const elements = document.querySelectorAll('a-cylinder, a-sphere, a-cone, a-torus');
                    elements.forEach((el, i) => {
                        if (i % 5 === 0) {
                            el.setAttribute('gentle-pulse', '');
                        }
                    });
                }, 3000);
            }
            
            console.log('ERA5 AR Viewer initialized');
            console.log('Point your camera at the monitor display with the four corner markers');
        }
    </script>
</body>
</html>
